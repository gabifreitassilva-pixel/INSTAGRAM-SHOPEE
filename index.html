<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Vídeos - Achadinhos 360</title>
    
    <!-- Conectando o App e o Ícone -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.png" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.png">
    <meta name="theme-color" content="#f97316">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-panel { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .gradient-text { background: linear-gradient(135deg, #f97316, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #f97316; width: 24px; height: 24px; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        tbody tr { transition: all 0.3s ease; }
        
        /* Sistema de Avisos (Toast) */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; border-radius: 8px; color: white; font-size: 14px; font-weight: 500; box-shadow: 0 4px 6px rgba(0,0,0,0.1); opacity: 0; transform: translateY(20px); transition: all 0.3s ease; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background-color: #10b981; }
        .toast.error { background-color: #ef4444; }
        .toast.warning { background-color: #f59e0b; }
    </style>
</head>
<body class="min-h-screen text-slate-800 p-4 md:p-8">

    <div id="toast-container"></div>

    <div class="max-w-[1400px] mx-auto">
        <header class="mb-8 text-center flex flex-col items-center">
            <h1 class="text-4xl font-bold mb-2">Máquina de Posts <span class="gradient-text">Afiliado IA</span></h1>
            <p class="text-slate-500 mb-4">Gerencie vídeos e legendas rapidamente direto da memória do navegador.</p>
            
            <div class="flex flex-wrap gap-4 justify-center items-center w-full max-w-2xl">
                <input type="text" id="apiKey" value="" 
                       class="flex-1 bg-slate-100 border border-slate-300 text-slate-500 rounded-lg p-3 outline-none font-mono text-xs focus:border-orange-500 focus:bg-white transition-colors shadow-sm" placeholder="Sua Chave API Gemini (Cole aqui)">
                <button onclick="window.exportarCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg text-sm shadow-md transition-colors flex items-center gap-2">
                    <span>📊</span> Exportar CSV
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <label class="glass-panel rounded-2xl p-6 cursor-pointer block border-2 border-slate-200 hover:border-orange-400 bg-orange-50/10 transition-colors text-center relative overflow-hidden group">
                <input type="file" id="htmlUpload" accept=".html" multiple class="hidden" />
                <h2 class="text-xl font-bold mb-2 text-orange-600">Passo 1: Ler Telegram</h2>
                <p class="text-sm text-slate-600 mb-4">Envie <strong>messages.html</strong> para mapear links.</p>
                <div class="inline-flex items-center justify-center p-3 rounded-xl bg-orange-100 text-orange-700 font-semibold text-sm w-full shadow-sm border border-orange-200">
                    <span id="htmlStatus">📁 1. Importar HTML</span>
                </div>
            </label>

            <label class="glass-panel rounded-2xl p-6 cursor-pointer block border-2 border-slate-200 hover:border-emerald-400 bg-emerald-50/10 transition-colors text-center relative overflow-hidden group">
                <input type="file" id="planilhaUpload" accept=".xlsx, .csv" class="hidden" />
                <h2 class="text-xl font-bold mb-2 text-emerald-600">Passo 2: Planilha</h2>
                <p class="text-sm text-slate-600 mb-4">Envie <strong>(.xlsx)</strong> com as 2 colunas de links.</p>
                <div class="inline-flex items-center justify-center p-3 rounded-xl bg-emerald-100 text-emerald-700 font-semibold text-sm w-full shadow-sm border border-emerald-200">
                    <span id="planilhaStatus">📊 2. Enviar Planilha</span>
                </div>
            </label>

            <label class="glass-panel rounded-2xl p-6 cursor-pointer block border-2 border-slate-200 hover:border-fuchsia-400 bg-fuchsia-50/10 transition-colors text-center relative overflow-hidden group">
                <input id="videoUpload" type="file" accept="video/mp4,video/quicktime,video/webm" multiple class="hidden" />
                <h2 class="text-xl font-bold mb-2 text-fuchsia-700">Passo 3: Analisar</h2>
                <p class="text-sm text-slate-600 mb-4">Selecione os <strong>vídeos</strong> para gerar legendas.</p>
                <div class="inline-flex items-center justify-center p-3 rounded-xl bg-fuchsia-100 text-fuchsia-700 font-semibold text-sm w-full shadow-sm border border-fuchsia-200">
                    <span>🎬 3. Gerar Legendas</span>
                </div>
            </label>
        </div>

        <div class="glass-panel rounded-2xl overflow-hidden shadow-sm" id="resultsContainer">
            <div class="bg-white border-b border-slate-200 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex gap-6 items-center w-full md:w-auto overflow-x-auto">
                    <button id="tabPendentes" onclick="window.mudarAba('pendentes')" class="font-bold text-orange-600 border-b-2 border-orange-600 pb-1 whitespace-nowrap transition-colors text-sm md:text-base">
                        Para Postar (<span id="countPendentes">0</span>)
                    </button>
                    <button id="tabPostados" onclick="window.mudarAba('postados')" class="font-bold text-slate-400 hover:text-slate-600 border-b-2 border-transparent pb-1 whitespace-nowrap transition-colors text-sm md:text-base">
                        Postados (<span id="countPostados">0</span>)
                    </button>
                </div>
                <div class="relative w-full md:w-72">
                    <input type="text" id="searchInput" placeholder="Buscar produto ou legenda..." oninput="window.filtrarTabela()" 
                           class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-orange-500 shadow-sm transition-all">
                    <span class="absolute left-3 top-2.5 text-slate-400">🔍</span>
                </div>
            </div>

            <div class="overflow-x-auto md:overflow-visible p-3 md:p-0 bg-slate-100 md:bg-transparent">
                <table class="w-full text-left border-collapse lg:min-w-[1100px]">
                    <thead class="hidden md:table-header-group">
                        <tr class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="px-6 py-4 font-bold w-1/5">Vídeo & Produto</th>
                            <th class="px-6 py-4 font-bold w-1/4">Gestão de Links</th>
                            <th class="px-6 py-4 font-bold w-auto">Legendas (Insta & Shopee)</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpoPendentes" class="md:divide-y divide-slate-100 bg-transparent md:bg-white flex flex-col md:table-row-group gap-4 md:gap-0"></tbody>
                    <tbody id="tabelaCorpoPostados" class="md:divide-y divide-slate-100 bg-transparent md:bg-slate-50 hidden flex-col md:table-row-group gap-4 md:gap-0"></tbody>
                </table>
                <div id="emptyState" class="p-12 text-center text-slate-400">
                    <p class="text-lg">Nenhuma postagem processada ainda.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DO MOTOR PWA (FORÇANDO A INSTALAÇÃO) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
                    navigator.serviceWorker.register('./sw.js')
                        .then(registration => console.log('Motor do App ativado!', registration.scope))
                        .catch(error => console.error('Erro no App:', error));
                }
            });
        }
    </script>

    <!-- SISTEMA DA APLICAÇÃO -->
    <script>
        let bancoDePostagens = [];
        let linksDoTelegram = JSON.parse(localStorage.getItem('achadinhos_links') || '{}'); 

        function mostrarAviso(mensagem, tipo = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerText = mensagem;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 4000);
        }

        document.getElementById('htmlUpload').addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length === 0) return;
            let linksAdicionadosNestaRodada = 0;
            const statusEl = document.getElementById('htmlStatus');
            statusEl.innerHTML = `⏳ Lendo arquivo...`;
            
            try {
                for(let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const htmlContent = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = event => resolve(event.target.result);
                        reader.readAsText(file);
                    });

                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlContent, 'text/html');
                    const messages = doc.querySelectorAll('.message.default');
                    
                    Array.from(messages).forEach((msg) => {
                        let shopeeLink = '';
                        const textElement = msg.querySelector('.text');
                        
                        if (textElement) {
                            const links = textElement.querySelectorAll('a');
                            Array.from(links).forEach(l => {
                                const href = l.getAttribute('href') || '';
                                if (href.includes('shopee.com') || l.textContent.includes('shopee.com')) {
                                    shopeeLink = href || l.textContent.trim();
                                }
                            });
                            if (!shopeeLink) {
                                const match = textElement.textContent.match(/https?:\/\/[^\s]+shopee\.com[^\s]+/i);
                                if (match) shopeeLink = match[0];
                            }
                        }

                        let videoName = '';
                        const videoAnchor = msg.querySelector('.video_file_wrap, .media_wrap .video_file, .media_wrap a.video_file');
                        const imgThumb = msg.querySelector('img.video_file');

                        if (videoAnchor && videoAnchor.getAttribute('href')) {
                            videoName = videoAnchor.getAttribute('href').split('/').pop();
                        } else if (imgThumb && imgThumb.getAttribute('src')) {
                            videoName = imgThumb.getAttribute('src').split('/').pop().replace('_thumb.jpg', '');
                        }
                        
                        if (videoName && shopeeLink) {
                            let afiliadoLink = '';
                            const inputAfiliado = msg.querySelector('.afiliado-input');
                            if (inputAfiliado) afiliadoLink = inputAfiliado.getAttribute('value') || inputAfiliado.value || '';
                            linksDoTelegram[videoName] = { original: shopeeLink, convertido: afiliadoLink.trim() };
                            linksAdicionadosNestaRodada++;
                        }
                    });
                }

                if (linksAdicionadosNestaRodada > 0) {
                    localStorage.setItem('achadinhos_links', JSON.stringify(linksDoTelegram));
                    statusEl.innerHTML = `✅ Links na memória!`;
                    statusEl.className = "inline-flex items-center justify-center p-3 rounded-xl bg-emerald-100 text-emerald-700 font-semibold text-sm w-full shadow-sm border border-emerald-200";
                    mostrarAviso(`+${linksAdicionadosNestaRodada} links importados.`, "success");
                } else {
                    statusEl.innerHTML = `⚠️ Nenhum link achado`;
                }
            } catch (error) { mostrarAviso("Erro ao processar HTML.", "error"); }
        });

        function normalizarLink(link) {
            if (!link) return '';
            let limpo = String(link).trim().replace(/[\u200B-\u200D\uFEFF\r\n]/g, '');
            limpo = limpo.replace(/^https?:\/\//i, '').replace(/^www\./i, '').replace(/^s\./i, '').split('?')[0].replace(/\/$/, '');
            return limpo;
        }

        function extrairIdShopee(linkLimpo) {
            if (!linkLimpo) return '';
            const partes = linkLimpo.split('/');
            return partes[partes.length - 1]; 
        }

        document.getElementById('planilhaUpload').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('planilhaStatus');
            statusEl.innerHTML = `⏳ Lendo planilha...`;

            try {
                let json = [];
                if (file.name.toLowerCase().endsWith('.csv')) {
                    const texto = await file.text();
                    const linhas = texto.split(/\r?\n/);
                    for (let linha of linhas) {
                        if (!linha.trim()) continue;
                        let colunas = linha.split(';'); 
                        if (colunas.length < 2) colunas = linha.split(','); 
                        if (colunas.length >= 2) json.push([colunas[0].replace(/"/g, ''), colunas[1].replace(/"/g, '')]);
                    }
                } else {
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    json = XLSX.utils.sheet_to_json(worksheet, {header: 1}); 
                }

                let linksMapeados = 0;
                for (let i = 0; i < json.length; i++) { 
                    const row = json[i];
                    if (!row || row.length < 2) continue;
                    
                    const original = String(row[0]).trim();
                    const convertido = String(row[1]).trim();
                    if (original.toLowerCase().includes('original') || !original.includes('http')) continue;

                    if (original && convertido) {
                        const originalLimpo = normalizarLink(original);
                        const idOriginal = extrairIdShopee(originalLimpo);

                        for (const videoName in linksDoTelegram) {
                            const linkMemoria = linksDoTelegram[videoName].original || '';
                            const memoriaLimpa = normalizarLink(linkMemoria);
                            const idMemoria = extrairIdShopee(memoriaLimpa);

                            if ((memoriaLimpa === originalLimpo && memoriaLimpa.length > 0) || 
                                (idMemoria === idOriginal && idMemoria.length > 5) ||
                                (memoriaLimpa.includes(originalLimpo) && originalLimpo.length > 15) ||
                                (originalLimpo.includes(memoriaLimpa) && memoriaLimpa.length > 15)) {
                                linksDoTelegram[videoName].convertido = convertido; 
                                linksMapeados++;
                            }
                        }
                    }
                }

                localStorage.setItem('achadinhos_links', JSON.stringify(linksDoTelegram));
                statusEl.innerHTML = `✅ ${linksMapeados} vinculados!`;
                statusEl.className = "inline-flex items-center justify-center p-3 rounded-xl bg-emerald-100 text-emerald-700 font-semibold text-sm w-full shadow-sm border border-emerald-200";
                mostrarAviso(`${linksMapeados} links vinculados com sucesso!`, "success");
            } catch (error) { mostrarAviso("Erro ao ler a planilha.", "error"); statusEl.innerHTML = `⚠️ Erro na leitura`; }
        });

        document.getElementById('videoUpload').addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                mostrarAviso("Cole a chave da API do Gemini lá no topo primeiro.", "error");
                return;
            }

            window.mudarAba('pendentes');
            const tbody = document.getElementById('tabelaCorpoPendentes');
            document.getElementById('emptyState').classList.add('hidden');

            const tamanhoDoLote = 10;
            const arrayDeArquivos = Array.from(files);

            for (let i = 0; i < arrayDeArquivos.length; i += tamanhoDoLote) {
                const lote = arrayDeArquivos.slice(i, i + tamanhoDoLote);
                
                await Promise.all(lote.map(async (file) => {
                    const storedLinkData = linksDoTelegram[file.name];
                    let originalLink = "Link não encontrado.";
                    let linkPreConvertido = "";
                    
                    if (storedLinkData) {
                        originalLink = typeof storedLinkData === 'string' ? storedLinkData : (storedLinkData.original || originalLink);
                        linkPreConvertido = typeof storedLinkData === 'object' ? (storedLinkData.convertido || "") : "";
                    }
                    
                    if(bancoDePostagens.find(p => p.videoNome === file.name)) return; 
                    if (originalLink === "Link não encontrado.") return;

                    const rowId = 'row-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
                    const tr = document.createElement('tr');
                    tr.id = rowId;
                    tr.className = "item-postagem skeleton-row flex flex-col md:table-row bg-white border border-slate-200 md:border-none rounded-xl md:rounded-none shadow-sm md:shadow-none overflow-hidden mb-4 md:mb-0";
                    
                    tr.innerHTML = `
                        <td class="p-4 md:px-6 md:py-4 align-top border-b border-slate-100 md:border-none"><div class="w-32 h-40 bg-slate-200 animate-pulse rounded-lg flex items-center justify-center mb-2"><div class="spinner"></div></div></td>
                        <td class="p-4 md:px-6 md:py-4 align-top border-b border-slate-100 md:border-none"><div class="h-10 bg-slate-200 rounded animate-pulse mb-3 w-full"></div></td>
                        <td class="p-4 md:px-6 md:py-4 align-top"><div class="grid grid-cols-2 gap-4"><div class="h-32 bg-slate-200 rounded animate-pulse w-full"></div></div></td>
                    `;
                    tbody.prepend(tr);

                    try {
                        const framesBase64 = await extrairFlipbook(file);
                        const iaData = await analisarImagemGemini(framesBase64, apiKey);
                        const videoUrlLocal = URL.createObjectURL(file);
                        
                        const novoPost = {
                            id: rowId, videoNome: file.name, videoUrl: videoUrlLocal, produto: iaData.produto, linkOriginal: originalLink,
                            linkAfiliado: linkPreConvertido, legendaInsta: iaData.legenda_instagram, legendaShopee: iaData.legenda_shopee, status: 'pendente'
                        };
                        
                        bancoDePostagens.push(novoPost);
                        renderizarPostDOM(novoPost, true);
                    } catch (error) { atualizarLinhaErro(rowId, file, error.message, originalLink); }
                }));
                
                atualizarContadores();
                window.filtrarTabela();
            }
        });

        function extrairFlipbook(file) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const frames = [];
                const maxFrames = 4;

                video.muted = true; video.playsInline = true; video.preload = 'auto';
                video.src = URL.createObjectURL(file);
                
                video.onloadeddata = () => {
                    canvas.width = 320; 
                    canvas.height = (video.videoHeight / video.videoWidth) * 320; 
                    let currentFrame = 1;
                    const interval = video.duration / maxFrames;

                    video.onseeked = () => {
                        try {
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            const base64Data = canvas.toDataURL('image/jpeg', 0.4).split(',')[1];
                            frames.push({ inlineData: { data: base64Data, mimeType: "image/jpeg" } });
                            currentFrame++;
                            if (currentFrame <= maxFrames) video.currentTime = interval * currentFrame - (interval / 2);
                            else { URL.revokeObjectURL(video.src); resolve(frames); }
                        } catch (e) { reject(new Error("Erro de extração.")); }
                    };
                    video.currentTime = interval / 2; 
                };
                video.onerror = () => reject(new Error("Erro de vídeo."));
                video.load();
            });
        }

        async function analisarImagemGemini(framesArray, apiKey) {
            const prompt = `Copywriter de Afiliados. Retorne um JSON válido com chaves: "produto", "legenda_instagram" (emojis e 5 hashtags ex: #shopee) e "legenda_shopee" (max 140 chars e 2 hashtags). Sempre coloque o link como [LINK AQUI].`;
            const payload = { contents: [{ parts: [{ text: prompt }, ...framesArray] }], generationConfig: { temperature: 0.7 } };
            const apiUrl = `https://generativelanguage.googleapis.com/v1/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

            let attempt = 0; let delay = 1000;
            while (attempt < 3) {
                try {
                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error("Erro na API.");
                    const data = await response.json();
                    return JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json/gi, '').replace(/```/g, '').trim());
                } catch (error) { attempt++; await new Promise(r => setTimeout(r, delay)); delay *= 2; if(attempt>=3) throw error; }
            }
        }

        function renderizarPostDOM(post, isUpdate = false) {
            const tbody = post.status === 'postado' ? document.getElementById('tabelaCorpoPostados') : document.getElementById('tabelaCorpoPendentes');
            let tr;
            if (isUpdate) { tr = document.getElementById(post.id); if(tr) tr.classList.remove('skeleton-row'); if(tr && tr.parentNode !== tbody) tbody.prepend(tr); } 
            if (!tr) { tr = document.createElement('tr'); tr.id = post.id; tbody.prepend(tr); }
            
            tr.className = "item-postagem flex flex-col md:table-row bg-white border border-slate-200 md:border-none rounded-xl md:rounded-none shadow-sm md:shadow-none overflow-hidden transition-colors hover:bg-slate-50 mb-4 md:mb-0";
            
            const btnPostadoHtml = post.status === 'postado' 
                ? `<button onclick="window.alternarPostado('${post.id}')" class="flex-1 bg-slate-400 hover:bg-slate-500 text-white font-bold py-2 rounded text-xs">⏪ Desfazer</button>`
                : `<button onclick="window.alternarPostado('${post.id}')" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 rounded text-xs">✅ Marcar Postado</button>`;

            tr.innerHTML = `
                <td class="p-4 md:px-6 md:py-4 align-top border-b border-slate-100 md:border-none">
                    <div class="w-32 h-40 bg-black rounded-lg overflow-hidden relative mb-2 flex-shrink-0">
                        <video src="${post.videoUrl}" class="w-full h-full object-cover" controls preload="metadata"></video>
                    </div>
                    <h4 class="font-bold text-slate-800 text-sm mt-2">${post.produto}</h4>
                    <p class="text-[10px] text-slate-400 truncate w-32" title="${post.videoNome}">${post.videoNome}</p>
                </td>
                <td class="p-4 md:px-6 md:py-4 align-top border-b border-slate-100 md:border-none">
                    <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl mb-3">
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">1. ORIGINAL</label>
                        <a href="${post.linkOriginal}" target="_blank" class="text-xs text-blue-600 hover:underline break-all block truncate">${post.linkOriginal}</a>
                    </div>
                    <div class="bg-orange-50 border border-orange-200 p-3 rounded-xl">
                        <label class="text-[10px] font-bold text-orange-700 block mb-1">2. AFILIADO</label>
                        <input type="url" placeholder="Cole aqui..." value="${post.linkAfiliado || ''}" class="w-full border border-orange-200 rounded p-2 text-xs outline-none focus:border-orange-500" oninput="window.atualizarLegendasDOM('${post.id}', this.value)">
                    </div>
                </td>
                <td class="p-4 md:px-6 md:py-4 align-top">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
                        <div>
                            <label class="text-[10px] font-bold text-fuchsia-600 block mb-1">INSTA</label>
                            <textarea class="w-full h-24 bg-slate-50 border border-slate-200 rounded p-2 text-xs legenda-insta" readonly data-original="${post.legendaInsta.replace(/"/g, '&quot;')}">${post.linkAfiliado ? post.legendaInsta.replace(/\[LINK AQUI\]/gi, post.linkAfiliado) : post.legendaInsta}</textarea>
                            <button onclick="window.copiarTexto(this, 'legenda-insta')" class="w-full mt-1 bg-fuchsia-100 text-fuchsia-700 font-bold py-1.5 rounded text-xs">Copiar Insta</button>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-orange-600 block mb-1">SHOPEE</label>
                            <textarea class="w-full h-24 bg-slate-50 border border-slate-200 rounded p-2 text-xs legenda-shopee" readonly data-original="${post.legendaShopee.replace(/"/g, '&quot;')}">${post.linkAfiliado ? post.legendaShopee.replace(/\[LINK AQUI\]/gi, post.linkAfiliado) : post.legendaShopee}</textarea>
                            <button onclick="window.copiarTexto(this, 'legenda-shopee')" class="w-full mt-1 bg-orange-100 text-orange-700 font-bold py-1.5 rounded text-xs">Copiar Shopee</button>
                        </div>
                    </div>
                    <div class="flex gap-2">${btnPostadoHtml}<button onclick="window.excluirPostagem('${post.id}')" class="bg-red-50 text-red-500 font-bold py-2 px-3 rounded text-xs">🗑️</button></div>
                </td>
            `;
        }

        function atualizarLinhaErro(rowId, file, errorMessage, linkOriginal) {
            const tr = document.getElementById(rowId); if(!tr) return;
            tr.innerHTML = `<td class="p-4" colspan="3"><div class="bg-red-50 text-red-700 p-3 text-xs">Erro em ${file.name}: ${errorMessage} <button onclick="this.closest('tr').remove();" class="ml-4 font-bold">OK</button></div></td>`;
        }

        window.atualizarLegendasDOM = function(rowId, linkInserido) {
            const tr = document.getElementById(rowId);
            const link = linkInserido.trim() === '' ? '[LINK AQUI]' : linkInserido.trim();
            const instaEl = tr.querySelector('.legenda-insta'); if(instaEl) instaEl.value = instaEl.dataset.original.replace(/\[LINK AQUI\]/gi, link);
            const shopeeEl = tr.querySelector('.legenda-shopee'); if(shopeeEl) shopeeEl.value = shopeeEl.dataset.original.replace(/\[LINK AQUI\]/gi, link);
            const postIndex = bancoDePostagens.findIndex(p => p.id === rowId); if(postIndex !== -1) bancoDePostagens[postIndex].linkAfiliado = linkInserido.trim();
        };

        window.alternarPostado = function(rowId) {
            const postIndex = bancoDePostagens.findIndex(p => p.id === rowId); if(postIndex === -1) return;
            bancoDePostagens[postIndex].status = bancoDePostagens[postIndex].status === 'pendente' ? 'postado' : 'pendente';
            renderizarPostDOM(bancoDePostagens[postIndex], true); atualizarContadores(); window.filtrarTabela();
        };

        window.excluirPostagem = function(rowId) {
            const postIndex = bancoDePostagens.findIndex(p => p.id === rowId); if(postIndex === -1) return;
            URL.revokeObjectURL(bancoDePostagens[postIndex].videoUrl);
            bancoDePostagens.splice(postIndex, 1);
            const tr = document.getElementById(rowId); if(tr) tr.remove();
            atualizarContadores(); window.filtrarTabela();
        };

        window.copiarTexto = function(btn, classe) {
            const tr = btn.closest('tr');
            const textarea = tr.querySelector('.' + classe);
            textarea.select(); navigator.clipboard.writeText(textarea.value);
            const ori = btn.innerHTML; btn.innerHTML = '✅ Copiado!';
            setTimeout(() => { btn.innerHTML = ori; }, 2000);
        };

        window.mudarAba = function(aba) {
            document.getElementById('tabelaCorpoPendentes').classList.toggle('hidden', aba !== 'pendentes');
            document.getElementById('tabelaCorpoPostados').classList.toggle('hidden', aba === 'postados');
            document.getElementById('tabPendentes').classList.toggle('text-slate-400', aba !== 'pendentes');
            document.getElementById('tabPendentes').classList.toggle('text-orange-600', aba === 'pendentes');
            document.getElementById('tabPostados').classList.toggle('text-slate-400', aba !== 'postados');
            document.getElementById('tabPostados').classList.toggle('text-orange-600', aba === 'postados');
            window.filtrarTabela();
        };

        window.filtrarTabela = function() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const id = document.getElementById('tabelaCorpoPendentes').classList.contains('hidden') ? 'tabelaCorpoPostados' : 'tabelaCorpoPendentes';
            const linhas = document.getElementById(id).querySelectorAll('.item-postagem');
            let vis = 0;
            linhas.forEach(row => { if(row.innerText.toLowerCase().includes(term)) { row.style.display = ''; vis++; } else { row.style.display = 'none'; } });
            document.getElementById('emptyState').classList.toggle('hidden', vis > 0);
        };

        function atualizarContadores() {
            document.getElementById('countPendentes').innerText = bancoDePostagens.filter(p => p.status === 'pendente').length;
            document.getElementById('countPostados').innerText = bancoDePostagens.filter(p => p.status === 'postado').length;
            window.filtrarTabela();
        }

        window.exportarCSV = function() {
            if(bancoDePostagens.length === 0) return mostrarAviso("Nada para exportar.");
            let csv = "data:text/csv;charset=utf-8,\uFEFFStatus,Produto,Link Original,Link Afiliado\n";
            bancoDePostagens.forEach(p => { csv += `"${p.status}","${(p.produto||'').replace(/"/g,'""')}","${p.linkOriginal}","${p.linkAfiliado}"\n`; });
            const link = document.createElement("a"); link.setAttribute("href", encodeURI(csv)); link.setAttribute("download", `Backup.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };
    </script>
</body>
</html>
